<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2740">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="COTEC FLOW">
  <meta name="format-detection" content="telephone=no">
  <title>COTEC 개발 FLOW</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-row">
        <div>
          <div class="eyebrow">COTEC DEVELOPMENT FLOW</div>
          <h1>통합 개발 진행관리</h1>
          <p>4개 프로그램 완성부터 통합 AI 분석까지 순서대로 진행합니다.</p>
        </div>
        <button id="resetBtn" class="ghost-btn" type="button" aria-label="전체 체크 초기화">초기화</button>
      </div>

      <section class="overall-card" aria-label="전체 진행률">
        <div class="overall-head">
          <div>
            <span class="small-label">전체 진행률</span>
            <strong id="overallPercent">0%</strong>
          </div>
          <span id="overallCount" class="count-pill">0 / 0 완료</span>
        </div>
        <div class="progress-track large" aria-hidden="true"><div id="overallBar" class="progress-fill"></div></div>
        <div id="nextAction" class="next-action">STEP 1부터 시작하세요.</div>
      </section>
    </header>

    <main>
      <section class="section-head">
        <div>
          <span class="section-kicker">ROADMAP</span>
          <h2>개발 FLOW</h2>
        </div>
        <p>단계를 누르면 세부 체크리스트가 열립니다.</p>
      </section>

      <div id="flow" class="flow" aria-label="개발 단계"></div>

      <section id="detailPanel" class="detail-panel" aria-live="polite">
        <div class="empty-state">
          <div class="empty-icon">✓</div>
          <h3>진행할 단계를 선택하세요</h3>
          <p>열려 있는 STEP을 누르면 세부 작업 목록을 확인할 수 있습니다.</p>
        </div>
      </section>
    </main>

    <footer>
      <span>COTEC FLOW</span>
      <span>진행상황은 이 iPhone의 브라우저에 자동 저장됩니다.</span>
    </footer>
  </div>
  <script type="module" src="./js/app.mjs"></script>
</body>
</html>
