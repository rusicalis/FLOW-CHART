  <style>
:root {
  --navy: #0b2740;
  --navy-2: #123a59;
  --teal: #17b3a6;
  --teal-dark: #0f8f86;
  --blue: #2f6ee5;
  --ink: #193247;
  --muted: #6f8393;
  --line: #dbe6ed;
  --panel: #ffffff;
  --soft: #f4f8fb;
  --soft-teal: #eaf8f6;
  --locked: #a8b6c1;
  --danger: #c54b55;
  --shadow: 0 12px 30px rgba(21, 50, 72, .08);
  --radius: 18px;
}

* { box-sizing: border-box; }
html { background: #eef4f7; }
body {
  margin: 0;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
  background: linear-gradient(180deg, #f7fafc 0%, #edf4f7 100%);
  min-height: 100%;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app-shell { max-width: 1100px; margin: 0 auto; padding: 0 18px 32px; }
.topbar {
  margin: 0 -18px 24px;
  padding: calc(24px + env(safe-area-inset-top)) 18px 22px;
  background: linear-gradient(145deg, var(--navy), var(--navy-2));
  color: #fff;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 12px 32px rgba(5, 33, 52, .18);
}
.brand-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; max-width: 1100px; margin: 0 auto; }
.eyebrow, .section-kicker { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: #70e2d8; }
h1 { font-size: clamp(25px, 5.6vw, 38px); margin: 5px 0 7px; letter-spacing: -.04em; }
.brand-row p { margin: 0; color: #d6e5ee; font-size: 14px; line-height: 1.6; }
.ghost-btn {
  min-width: 64px; min-height: 44px; border: 1px solid rgba(255,255,255,.28); border-radius: 13px;
  color: #fff; background: rgba(255,255,255,.08); font-weight: 750; padding: 0 13px;
}
.ghost-btn:active { transform: scale(.98); }

.overall-card {
  max-width: 1100px; margin: 20px auto 0; padding: 17px 18px 15px;
  border: 1px solid rgba(255,255,255,.16); border-radius: 18px; background: rgba(255,255,255,.10);
  backdrop-filter: blur(10px);
}
.overall-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.small-label { display: block; font-size: 12px; color: #cde0ea; margin-bottom: 2px; }
#overallPercent { font-size: 29px; letter-spacing: -.04em; }
.count-pill { font-size: 12px; font-weight: 750; background: rgba(255,255,255,.13); border: 1px solid rgba(255,255,255,.15); padding: 7px 10px; border-radius: 999px; color: #edf8fb; }
.progress-track { width: 100%; height: 8px; background: rgba(7, 29, 45, .12); border-radius: 999px; overflow: hidden; }
.progress-track.large { margin-top: 12px; height: 10px; background: rgba(255,255,255,.18); }
.progress-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #36e3d2, #4a9af2); transition: width .25s ease; }
.next-action { margin-top: 10px; font-size: 13px; color: #d7edf0; }

.section-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 24px 2px 14px; }
.section-head h2 { margin: 3px 0 0; font-size: 23px; letter-spacing: -.04em; }
.section-head p { margin: 0; font-size: 13px; color: var(--muted); text-align: right; }

.flow { display: grid; grid-template-columns: repeat(var(--stage-count, 6), minmax(150px, 1fr)); gap: 12px; overflow-x: auto; padding: 2px 2px 10px; scroll-snap-type: x proximity; }
.stage-card {
  position: relative; min-height: 188px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  padding: 15px; text-align: left; color: var(--ink); box-shadow: 0 5px 20px rgba(27, 57, 79, .05);
  cursor: pointer; scroll-snap-align: start; transition: transform .15s ease, border-color .2s ease, box-shadow .2s ease;
}
.stage-card:not(.locked):active { transform: scale(.985); }
.stage-card.active { border-color: rgba(23,179,166,.75); box-shadow: 0 9px 30px rgba(23,179,166,.13); }
.stage-card.complete { border-color: rgba(23,179,166,.48); background: linear-gradient(180deg, #fff, #f5fcfb); }
.stage-card.locked { cursor: not-allowed; background: #f3f6f8; color: #8999a5; box-shadow: none; }
.stage-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.step-label { color: var(--teal-dark); font-size: 11px; font-weight: 850; letter-spacing: .08em; }
.locked .step-label { color: #8f9eaa; }
.status-dot { width: 9px; height: 9px; border-radius: 50%; background: #d2dde4; box-shadow: 0 0 0 4px #f0f4f6; }
.complete .status-dot { background: var(--teal); box-shadow: 0 0 0 4px var(--soft-teal); }
.stage-card h3 { margin: 17px 0 7px; font-size: 16px; line-height: 1.35; letter-spacing: -.025em; }
.stage-card p { margin: 0; font-size: 12px; line-height: 1.55; color: var(--muted); min-height: 55px; }
.locked p { color: #99a7b0; }
.stage-progress { margin-top: 14px; }
.stage-progress-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11px; font-weight: 750; }
.stage-progress .progress-track { background: #edf2f5; height: 7px; }
.stage-card.locked .progress-fill { background: #bfc9d0; }
.lock-text { margin-top: 8px; font-size: 11px; color: #8b9aa5; display: none; }
.stage-card.locked .lock-text { display: block; }

.detail-panel { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; min-height: 230px; }
.detail-head { padding: 20px 20px 16px; border-bottom: 1px solid #e7eef2; background: linear-gradient(180deg, #fbfdfd, #f5fafa); }
.detail-step { font-size: 12px; font-weight: 850; color: var(--teal-dark); letter-spacing: .08em; }
.detail-title-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-top: 4px; }
.detail-title-row h3 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
.detail-percent { font-size: 23px; font-weight: 850; color: var(--navy); }
.detail-summary { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
.detail-head .progress-track { margin-top: 13px; height: 8px; background: #dfe9ee; }
.checklist { list-style: none; padding: 8px 12px 14px; margin: 0; }
.check-item { border-bottom: 1px solid #edf2f5; }
.check-item:last-child { border-bottom: 0; }
.check-label { display: flex; gap: 12px; align-items: flex-start; padding: 14px 9px; cursor: pointer; }
.check-label input { position: absolute; opacity: 0; pointer-events: none; }
.check-box {
  flex: 0 0 auto; width: 24px; height: 24px; margin-top: 1px; border: 2px solid #c5d2db; border-radius: 8px; background: #fff;
  display: grid; place-items: center; transition: all .15s ease;
}
.check-box::after { content: '✓'; color: #fff; font-size: 15px; font-weight: 900; opacity: 0; transform: scale(.7); transition: all .15s ease; }
.check-label input:checked + .check-box { background: var(--teal); border-color: var(--teal); }
.check-label input:checked + .check-box::after { opacity: 1; transform: scale(1); }
.check-copy { min-width: 0; }
.check-copy strong { display: block; font-size: 14px; line-height: 1.45; }
.check-copy span { display: block; margin-top: 3px; font-size: 12px; line-height: 1.55; color: var(--muted); }
.check-label input:checked ~ .check-copy strong { color: #638075; text-decoration: line-through; text-decoration-color: #9bcac4; }
.empty-state { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty-icon { width: 50px; height: 50px; margin: 0 auto 12px; border-radius: 16px; display: grid; place-items: center; background: var(--soft-teal); color: var(--teal-dark); font-weight: 900; font-size: 22px; }
.empty-state h3 { color: var(--ink); margin: 0 0 7px; font-size: 18px; }
.empty-state p { margin: 0; font-size: 13px; line-height: 1.6; }

footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 18px; padding: 0 3px calc(4px + env(safe-area-inset-bottom)); color: #8395a1; font-size: 11px; }
footer span:first-child { font-weight: 850; color: var(--navy-2); }

@media (max-width: 760px) {
  .app-shell { padding-left: 12px; padding-right: 12px; }
  .topbar { margin-left: -12px; margin-right: -12px; padding-left: 14px; padding-right: 14px; border-radius: 0 0 24px 24px; }
  .brand-row { align-items: flex-start; }
  .brand-row p { max-width: 260px; }
  .section-head { align-items: flex-start; }
  .section-head p { max-width: 145px; }
  .flow { grid-template-columns: repeat(6, 178px); margin-right: -12px; padding-right: 12px; }
  .stage-card { min-height: 181px; }
  .detail-panel { border-radius: 18px; }
  .detail-title-row { align-items: flex-start; }
  footer { flex-direction: column; gap: 4px; }
}

@media (max-width: 390px) {
  .ghost-btn { min-width: 58px; padding: 0 10px; }
  .section-head p { display: none; }
  .overall-head { align-items: center; }
  .detail-title-row h3 { font-size: 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
}

.stage-card[aria-disabled="true"] { pointer-events: auto; }

.detail-panel { scroll-margin-top: 12px; }
.stage-card.locked { opacity:.72; }

function deepClone(value) { return JSON.parse(JSON.stringify(value)); }
function makeId(prefix) {
  if (window.crypto && typeof window.crypto.randomUUID === 'function') return prefix + '-' + window.crypto.randomUUID();
  return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
}
function reindexStages(stages) {
  return (Array.isArray(stages) ? stages : []).map((stage, index) => ({
    ...deepClone(stage),
    number: index + 1,
    title: String(stage && stage.title || '새 STEP'),
    shortTitle: String(stage && (stage.shortTitle || stage.title) || ('STEP ' + (index + 1))),
    summary: String(stage && stage.summary || ''),
    tasks: Array.isArray(stage && stage.tasks) ? deepClone(stage.tasks) : []
  }));
}
function addStage(stages, stage) {
  const next = Array.isArray(stages) ? deepClone(stages) : [];
  next.push({
    id: stage.id,
    title: stage.title || '새 STEP',
    shortTitle: stage.shortTitle || stage.title || '새 STEP',
    summary: stage.summary || '',
    tasks: Array.isArray(stage.tasks) ? deepClone(stage.tasks) : []
  });
  return reindexStages(next);
}
function deleteStage(stages, stageId) {
  return reindexStages((Array.isArray(stages) ? stages : []).filter(stage => stage.id !== stageId));
}
function addTask(stages, stageId, task) {
  const next = deepClone(Array.isArray(stages) ? stages : []);
  const stage = next.find(item => item.id === stageId);
  if (!stage) return reindexStages(next);
  if (!Array.isArray(stage.tasks)) stage.tasks = [];
  stage.tasks.push({ id: task.id, label: task.label || '새 체크리스트', detail: task.detail || '' });
  return reindexStages(next);
}
function deleteTask(stages, stageId, taskId) {
  const next = deepClone(Array.isArray(stages) ? stages : []);
  const stage = next.find(item => item.id === stageId);
  if (stage && Array.isArray(stage.tasks)) stage.tasks = stage.tasks.filter(task => task.id !== taskId);
  return reindexStages(next);
}
function pruneState(currentState, stages) {
  const validIds = new Set((Array.isArray(stages) ? stages : []).flatMap(stage => Array.isArray(stage.tasks) ? stage.tasks.map(task => task.id) : []));
  return Object.fromEntries(Object.entries(currentState || {}).filter(([id]) => validIds.has(id)));
}

function calculateStageProgress(stage, currentState) {
  const tasks = Array.isArray(stage && stage.tasks) ? stage.tasks : [];
  if (!tasks.length) return 0;
  const done = tasks.filter(task => Boolean(currentState && currentState[task.id])).length;
  return Math.round((done / tasks.length) * 100);
}
function isStageComplete(stage, currentState) {
  const tasks = Array.isArray(stage && stage.tasks) ? stage.tasks : [];
  return tasks.length > 0 && calculateStageProgress(stage, currentState) === 100;
}
function calculateOverallProgress(stages, currentState) {
  const tasks = (Array.isArray(stages) ? stages : []).flatMap(stage => Array.isArray(stage.tasks) ? stage.tasks : []);
  if (!tasks.length) return 0;
  const done = tasks.filter(task => Boolean(currentState && currentState[task.id])).length;
  return Math.round((done / tasks.length) * 100);
}
function isStageUnlocked(stages, stageIndex, currentState) {
  if (stageIndex <= 0) return true;
  for (let i = 0; i < stageIndex; i += 1) {
    if (!isStageComplete(stages[i], currentState)) return false;
  }
  return true;
}
function toggleTaskState(currentState, taskId, checked) {
  return Object.assign({}, currentState || {}, { [taskId]: Boolean(checked) });
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
  } catch (error) { return {}; }
}
function loadRoadmap() {
  try {
    const raw = localStorage.getItem(ROADMAP_STORAGE_KEY);
    if (!raw) return reindexStages(DEFAULT_ROADMAP_STAGES);
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return reindexStages(DEFAULT_ROADMAP_STAGES);
    return reindexStages(parsed);
  } catch (error) { return reindexStages(DEFAULT_ROADMAP_STAGES); }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (error) {}
}
function saveRoadmap() {
  try { localStorage.setItem(ROADMAP_STORAGE_KEY, JSON.stringify(roadmapStages)); } catch (error) {}
}
function allTasks() { return roadmapStages.flatMap(stage => Array.isArray(stage.tasks) ? stage.tasks : []); }
function firstAvailableStageIndex() {
  if (!roadmapStages.length) return 0;
  let lastUnlocked = 0;
  roadmapStages.forEach((stage, index) => { if (isStageUnlocked(roadmapStages, index, state)) lastUnlocked = index; });
  return lastUnlocked;
}

  root.modalTitle.textContent = '체크리스트 신규등록';
  root.modalName.previousElementSibling.textContent = '체크리스트 이름';
  root.modalName.placeholder = '예: 연동 API 응답 검증';
  root.modalDescription.previousElementSibling.textContent = '세부 설명';
  root.modalDescription.placeholder = '완료 기준이나 확인할 내용을 입력하세요.';
  root.modalBackdrop.hidden = false;
  setTimeout(() => root.modalName.focus(), 0);
}
function clampActiveStage() {
  if (!roadmapStages.length) { activeStageIndex = 0; return; }
  activeStageIndex = Math.max(0, Math.min(activeStageIndex, roadmapStages.length - 1));
}
function persistRoadmapChange() {
  roadmapStages = reindexStages(roadmapStages);
  state = pruneState(state, roadmapStages);
  clampActiveStage();
  saveRoadmap();
  saveState();
  render();
}

function renderSummary() {
  const tasks = allTasks();
  const done = tasks.filter(task => state[task.id]).length;
  const percent = calculateOverallProgress(roadmapStages, state);
  root.overallPercent.textContent = percent + '%';
  root.overallCount.textContent = done + ' / ' + tasks.length + ' 완료';
  root.overallBar.style.width = percent + '%';
  if (!roadmapStages.length) {
    root.nextAction.textContent = 'STEP을 신규등록하여 FLOW를 시작하세요.';
    return;
  }
  const firstIncomplete = roadmapStages.findIndex(stage => !isStageComplete(stage, state));
  root.nextAction.textContent = firstIncomplete === -1
    ? '모든 단계가 완료되었습니다. 실제 운영 검증과 개선을 이어가세요.'
    : '다음 작업: STEP ' + (firstIncomplete + 1) + ' · ' + roadmapStages[firstIncomplete].shortTitle;
}

function renderFlow() {
  document.documentElement.style.setProperty('--stage-count', String(Math.max(1, roadmapStages.length)));
  if (!roadmapStages.length) {
    root.flow.innerHTML = '<div class="empty-flow"><div><strong>등록된 STEP이 없습니다.</strong><span>상단의 + STEP 신규등록 버튼으로 첫 FLOW를 만드세요.</span></div></div>';
    return;
  }
  root.flow.innerHTML = roadmapStages.map((stage, index) => {
    const progress = calculateStageProgress(stage, state);
    const unlocked = isStageUnlocked(roadmapStages, index, state);
    const active = index === activeStageIndex;
    const completed = stage.tasks.filter(task => state[task.id]).length;
    const classes = ['stage-card'];
    if (!unlocked) classes.push('locked');
    if (active) classes.push('active');
    if (isStageComplete(stage, state)) classes.push('complete');
    const hint = unlocked ? '세부 체크리스트 보기' : '검토 가능 · 체크는 잠금';
    return '<div class="stage-wrap">' +
      '<button class="' + classes.join(' ') + '" type="button" data-stage-index="' + index + '" aria-disabled="false">' +
        '<div class="stage-top"><span class="step-label">STEP ' + (index + 1) + '</span><span class="status-dot"></span></div>' +
        '<h3>' + escapeHtml(stage.shortTitle) + '</h3>' +
        '<p>' + escapeHtml(stage.summary) + '</p>' +
        '<div class="stage-progress">' +
          '<div class="stage-progress-row"><span>' + progress + '%</span><span>' + completed + '/' + stage.tasks.length + '</span></div>' +
          '<div class="progress-track"><div class="progress-fill" style="width:' + progress + '%"></div></div>' +
          '<div class="lock-text">이전 STEP 완료 후 체크 활성화</div>' +
          '<div class="tap-hint">' + hint + '</div>' +
        '</div>' +
      '</button>' +
      '<button class="stage-delete-quick" type="button" data-delete-stage-id="' + escapeHtml(stage.id) + '" aria-label="STEP ' + (index + 1) + ' 삭제">삭제</button>' +
    '</div>';
  }).join('');

  root.flow.querySelectorAll('.stage-card').forEach(button => {
    button.addEventListener('click', () => {
      activeStageIndex = Number(button.dataset.stageIndex);
      renderFlow();
      renderDetail();
      if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) {
        root.detail.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });
  root.flow.querySelectorAll('[data-delete-stage-id]').forEach(button => {
    button.addEventListener('click', event => {
      event.stopPropagation();
      const stageId = button.dataset.deleteStageId;
      const index = roadmapStages.findIndex(stage => stage.id === stageId);
      if (index < 0) return;
      const stage = roadmapStages[index];
      const confirmed = window.confirm('STEP ' + (index + 1) + ' · ' + stage.title + ' 을(를) 삭제하시겠습니까?\n해당 STEP의 체크리스트와 체크 상태도 함께 삭제됩니다.');
      if (!confirmed) return;
      roadmapStages = deleteStage(roadmapStages, stageId);
      if (activeStageIndex >= index && activeStageIndex > 0) activeStageIndex -= 1;
      persistRoadmapChange();
    });
  });
}

function renderDetail() {
  const stage = roadmapStages[activeStageIndex];
  if (!stage) {
    root.detail.innerHTML = '<div class="empty-state"><div class="empty-icon">＋</div><h3>STEP을 신규등록하세요</h3><p>등록된 STEP이 없으면 진행 FLOW가 표시되지 않습니다.</p></div>';
    return;
  }
  const progress = calculateStageProgress(stage, state);
  const unlocked = isStageUnlocked(roadmapStages, activeStageIndex, state);
  const managementNote = unlocked ? '' : '<p class="management-note">이 STEP은 이전 단계가 완료되기 전까지 체크는 잠겨 있습니다. STEP/체크리스트의 신규등록·삭제는 가능합니다.</p>';
  const taskList = stage.tasks.length ? stage.tasks.map(task =>
    '<li class="check-item"><div class="check-item-row"><label class="check-label">' +
      '<input type="checkbox" data-task-id="' + escapeHtml(task.id) + '" ' + (state[task.id] ? 'checked' : '') + ' ' + (!unlocked ? 'disabled' : '') + '>' +
      '<span class="check-box" aria-hidden="true"></span>' +
      '<span class="check-copy"><strong>' + escapeHtml(task.label) + '</strong><span>' + escapeHtml(task.detail) + '</span></span>' +
      '</label><button class="check-delete-btn" type="button" data-delete-task-id="' + escapeHtml(task.id) + '">삭제</button></div></li>'
  ).join('') : '<li class="empty-state" style="padding:26px 12px"><div class="empty-icon">＋</div><h3>체크리스트가 없습니다</h3><p>아래 신규등록 버튼으로 완료 기준을 추가하세요.</p></li>';

  root.detail.innerHTML = '<div class="detail-head">' +
    '<div class="detail-step">STEP ' + (activeStageIndex + 1) + '</div>' +
    '<div class="detail-title-row"><h3>' + escapeHtml(stage.title) + '</h3><div class="detail-percent">' + progress + '%</div></div>' +
    '<p class="detail-summary">' + escapeHtml(stage.summary) + '</p>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + progress + '%"></div></div>' +
    '<div class="detail-actions">' +
      '<button id="addTaskBtn" class="secondary-small-btn" type="button">+ 체크리스트 신규등록</button>' +
      '<button id="deleteCurrentStageBtn" class="danger-small-btn" type="button">STEP 삭제</button>' +
    '</div>' +
    '</div>' + managementNote + '<ul class="checklist">' + taskList + '</ul>';

  root.detail.querySelectorAll('input[type="checkbox"]').forEach(input => {
    input.addEventListener('change', () => {
      state = toggleTaskState(state, input.dataset.taskId, input.checked);
      saveState();
      render();
    });
  });
  root.detail.querySelector('#addTaskBtn').addEventListener('click', () => openAddTaskModal(stage.id));
  root.detail.querySelector('#deleteCurrentStageBtn').addEventListener('click', () => {
    const confirmed = window.confirm('STEP ' + (activeStageIndex + 1) + ' · ' + stage.title + ' 을(를) 삭제하시겠습니까?\n해당 STEP의 체크리스트와 체크 상태도 함께 삭제됩니다.');
    if (!confirmed) return;
    roadmapStages = deleteStage(roadmapStages, stage.id);
    if (activeStageIndex >= roadmapStages.length) activeStageIndex = Math.max(0, roadmapStages.length - 1);
    persistRoadmapChange();
  });
  root.detail.querySelectorAll('[data-delete-task-id]').forEach(button => {
    button.addEventListener('click', () => {
      const taskId = button.dataset.deleteTaskId;
      const task = stage.tasks.find(item => item.id === taskId);
      if (!task) return;
      const confirmed = window.confirm('체크리스트 “' + task.label + '” 을(를) 삭제하시겠습니까?');
      if (!confirmed) return;
      roadmapStages = deleteTask(roadmapStages, stage.id, taskId);
      delete state[taskId];
      persistRoadmapChange();
    });
  });
}

function render() {
  renderSummary();
  renderFlow();
  renderDetail();
}

root.addStageBtn.addEventListener('click', openAddStageModal);
root.modalCloseBtn.addEventListener('click', closeModal);
root.modalCancelBtn.addEventListener('click', closeModal);
root.modalBackdrop.addEventListener('click', event => { if (event.target === root.modalBackdrop) closeModal(); });
root.modalForm.addEventListener('submit', event => {
  event.preventDefault();
  const name = root.modalName.value.trim();
  const description = root.modalDescription.value.trim();
  if (!name) { root.modalName.focus(); return; }
  if (modalMode === 'stage') {
    roadmapStages = addStage(roadmapStages, { id: makeId('stage'), title: name, shortTitle: name, summary: description, tasks: [] });
    activeStageIndex = roadmapStages.length - 1;
    saveRoadmap();
    closeModal();
    render();
    return;
  }
  if (modalMode === 'task' && modalStageId) {
    roadmapStages = addTask(roadmapStages, modalStageId, { id: makeId('task'), label: name, detail: description });
    saveRoadmap();
    closeModal();
    render();
  }
});

root.resetBtn.addEventListener('click', () => {
  const confirmed = window.confirm('모든 체크 상태와 진행률을 초기화하시겠습니까?\n사용자가 등록한 STEP과 체크리스트는 유지됩니다.');
  if (!confirmed) return;
  state = {};
  activeStageIndex = 0;
  saveState();
  render();
});

saveRoadmap();
saveState();
render();
  </script>
</body>
</html>
